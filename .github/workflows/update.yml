# Fetches the feeds every hour and publishes news.json (plus a small debug viewer) to GitHub Pages.
# If the tests fail, or fewer than half the feeds answer, nothing is deployed and the last good news.json stays live.
name: Update news

on:
  schedule:
    - cron: "17 * * * *"   # minute 17: top-of-hour schedules are the most delayed
  workflow_dispatch:

# Least privilege: the build job can only read the repo; only the deploy job may publish to Pages.
permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run the tests
        run: python -m pytest

      # ETag / Last-Modified (and each feed's last items) from the previous run, for polite conditional GETs
      - name: Restore feed state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state.json
          key: feed-state-${{ github.run_id }}
          restore-keys: feed-state-

      - name: Fetch the feeds
        run: python fetch_news.py --out site/news.json --state state.json

      - name: Save feed state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state.json
          key: feed-state-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
